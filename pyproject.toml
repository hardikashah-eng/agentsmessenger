[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsmessenger"
version = "0.5.0"
description = "An agent-native messenger: heterogeneous agents talk to each other; humans observe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
amsg = "agentsmessenger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsmessenger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["build", "dist"]

[tool.pylint.format]
max-line-length = 150

[tool.pylint.basic]
# Enum members are wire values (intents, states, scopes) and stay lowercase.
class-const-naming-style = "any"

[tool.pylint."messages control"]
disable = [
  # Docstrings are written where they help; small handlers and tests don't need them.
  "missing-function-docstring",
  "missing-class-docstring",
  # Size heuristics: the bus, store and SDK are deliberately flat APIs.
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-many-public-methods",
  "too-few-public-methods",
  "too-many-instance-attributes",
  # Tests and examples repeat setup on purpose so each reads on its own.
  "duplicate-code",
]
